[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lantern"
version = "0.2.0"
description = "A desk device for your own Hermes Agent: the service behind a Raspberry Pi touchscreen."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lantern contributors" }]
dependencies = [
  "websockets>=13,<17",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "aiohttp>=3.9,<4", "pyflakes>=3"]

[project.urls]
Homepage = "https://github.com/j4ckxyz/lantern"

[project.scripts]
lantern = "lantern.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["lantern"]

[tool.setuptools.package-data]
# The built screen UI is copied here by the release build (device/build-bundle.sh).
lantern = ["ui/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
