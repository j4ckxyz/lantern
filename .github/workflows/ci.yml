name: ci

on:
  push:
    branches: [main, desk-appliance]
    tags: ["v*"]
  pull_request:

jobs:
  service:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]" shellcheck-py
      - run: python -m pyflakes src tests
      - run: python -m pytest -q
      - run: shellcheck device/install.sh device/build-bundle.sh device/kiosk.sh device/system/lantern-admin
      - name: No em dashes where people read
        run: make copy-check

  ui:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: ui/test-results

  real-stack:
    # The built UI against the real Python service and the stand-in Hermes.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m venv .venv && .venv/bin/pip install -e ".[dev]"
      - run: npm ci
        working-directory: ui
      - run: npx playwright install --with-deps chromium
        working-directory: ui
      - run: npm run e2e:real
        working-directory: ui

  bundle:
    needs: [service, ui, real-stack]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: sudo apt-get install -y zstd minisign
      - name: Build the release bundle
        env:
          MINISIGN_SECRET: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -n "$MINISIGN_SECRET" ]; then
            printf '%s\n' "$MINISIGN_SECRET" > "$RUNNER_TEMP/minisign.key"
            export MINISIGN_KEY="$RUNNER_TEMP/minisign.key"
          fi
          bash device/build-bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: dist/*.tar.zst
      - name: Publish on a version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.zst
